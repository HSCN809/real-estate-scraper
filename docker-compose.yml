x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Invisible Go Proxy - Cloudflare Bypass
  invisible-proxy:
    build:
      context: ./Backend/go
      dockerfile: Dockerfile
    container_name: invisible-proxy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PROXY_HOST=0.0.0.0
      - PROXY_PORT=8080
      - PROXY_READ_TIMEOUT=30
      - PROXY_WRITE_TIMEOUT=30

      # Residential/upstream proxy configuration (optional)
      - USE_MOBILE_PROXY=${USE_MOBILE_PROXY:-true}
      - MOBILE_PROXY_URL=${MOBILE_PROXY_URL:-}
      - MOBILE_PROXY_USER=${MOBILE_PROXY_USER:-}
      - MOBILE_PROXY_PASS=${MOBILE_PROXY_PASS:-}

      # TLS Fingerprint Configuration
      # HepsiEmlak testlerinde HelloChrome_133 + Chrome 133 UA kombinasyonu
      # uTLS ALPN h2 ve Client Hints ile Cloudflare challenge'ini asar.
      - TLS_CLIENT_ID=HelloChrome_133
      - TLS_ROTATE=false
      - TLS_ROTATE_LIST=HelloChrome_133
      - USER_AGENT=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/133.0.0.0 Safari/537.36

      # Connection Pool Configuration
      - MAX_IDLE_CONNS=100
      - MAX_IDLE_CONNS_PER_HOST=10
      - IDLE_CONN_TIMEOUT=90

      # Retry Configuration
      - MAX_RETRIES=2
      - RETRY_DELAY=1000

      # Security Configuration
      - PROXY_API_KEY=${PROXY_API_KEY:-}
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://real-estate-frontend:3000,http://localhost:8000,http://real-estate-api:8000

      # Rate Limiting
      - RATE_LIMIT=10
      - RATE_LIMIT_BURST=25

      # Debug mode
      - DEBUG=false

    volumes:
      - ./Backend/go/logs:/app/logs
    networks:
      - real-estate-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 128
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # PostgreSQL Database
  real-estate-db:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    container_name: real-estate-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - real-estate-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 256
    logging: *default-logging
    networks:
      - real-estate-network

  # Valkey (Redis-compatible) - Message Broker for Celery
  real-estate-redis:
    image: valkey/valkey:8.1-alpine@sha256:9971099af41c36e887aabdfe22b80c0fe45df949163dfc9cb434febc57cfc3fc
    container_name: real-estate-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - real-estate-redis-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 128
    logging: *default-logging
    networks:
      - real-estate-network

  # Backend API - FastAPI (No scraping here, just API)
  real-estate-api:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: real-estate-api
    ports:
      - "127.0.0.1:${FASTAPI_PORT:-8000}:8000"
    volumes:
      # Source code mount (hot reload)
      - ./Backend:/app
    environment:
      - FASTAPI_HOST=${FASTAPI_HOST}
      - FASTAPI_PORT=${FASTAPI_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_DAYS=${ACCESS_TOKEN_EXPIRE_DAYS}
      - ENVIRONMENT=${ENVIRONMENT}
      - LOG_LEVEL=${LOG_LEVEL}
      - HEPSIEMLAK_MAX_PAGES=${HEPSIEMLAK_MAX_PAGES}
      - EMLAKJET_MAX_PAGES=${EMLAKJET_MAX_PAGES}
      - PROXY_API_KEY=${PROXY_API_KEY:-}
    depends_on:
      real-estate-db:
        condition: service_healthy
      real-estate-redis:
        condition: service_healthy
      invisible-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 256
    logging: *default-logging
    networks:
      - real-estate-network

  # Celery Worker - Scraping tasks run here
  real-estate-worker:
    build:
      context: .
      dockerfile: Backend/Dockerfile.worker
    container_name: real-estate-worker
    init: true  # Zombie process'leri temizler
    shm_size: '2gb'  # Chrome için shared memory
    security_opt:
      - seccomp:./Backend/seccomp-chrome.json
    volumes:
      # Source code mount (hot reload)
      - ./Backend:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CHROME_HEADLESS=${CHROME_HEADLESS}
      - LOG_LEVEL=${LOG_LEVEL}
      - GO_PROXY_URL=http://invisible-proxy:8080
      - USE_GO_PROXY=${USE_GO_PROXY:-false}
      - PROXY_API_KEY=${PROXY_API_KEY:-}
      - LOG_FILE=/tmp/scraper-logs/scraper.log
      - LOG_FALLBACK_DIR=/tmp/scraper-logs
    depends_on:
      real-estate-db:
        condition: service_healthy
      real-estate-redis:
        condition: service_healthy
      invisible-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
          pids: 512
    logging: *default-logging
    networks:
      - real-estate-network

  # Flower - Celery Monitoring UI
  real-estate-flower:
    image: mher/flower:2.2.0@sha256:c74195a78297f1634fbd7fb6497cf329e39614a262371a058d5d5b13656ca40e
    container_name: real-estate-flower
    ports:
      - "127.0.0.1:5555:5555"
    volumes:
      - real-estate-flower-data:/app/flower_data
      # Avoid anonymous volume created by image-level VOLUME /data
      - real-estate-flower-runtime-data:/data
    environment:
      - CELERY_BROKER_URL=${REDIS_URL}
      - FLOWER_PORT=5555
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH}
      - FLOWER_DB=/app/flower_data/flower.db
    depends_on:
      real-estate-redis:
        condition: service_healthy
      real-estate-worker:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 128
    logging: *default-logging
    networks:
      - real-estate-network

  # Frontend - Next.js (Development Mode with Hot Reload)
  real-estate-frontend:
    profiles: ["dev"]
    image: node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
    container_name: real-estate-frontend
    working_dir: /app
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Source code mount for hot reload
      - ./Frontend:/app
      # Named volume for node_modules
      - real-estate-frontend-node-modules:/app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_HEPSIEMLAK_MAX_PAGES=${NEXT_PUBLIC_HEPSIEMLAK_MAX_PAGES}
      - NEXT_PUBLIC_HEPSIEMLAK_MIN_PAGES=${NEXT_PUBLIC_HEPSIEMLAK_MIN_PAGES}
      - NEXT_PUBLIC_EMLAKJET_MAX_PAGES=${NEXT_PUBLIC_EMLAKJET_MAX_PAGES}
      - NEXT_PUBLIC_EMLAKJET_MIN_PAGES=${NEXT_PUBLIC_EMLAKJET_MIN_PAGES}
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev"
    depends_on:
      real-estate-api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 256
    logging: *default-logging
    networks:
      - real-estate-network

  # Frontend - Next.js (Production Standalone Mode via `--profile prod`)
  real-estate-frontend-prod:
    profiles: ["prod"]
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: real-estate-frontend-prod
    ports:
      - "127.0.0.1:${FRONTEND_PROD_PORT:-3001}:3000"
    depends_on:
      real-estate-api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 128
    logging: *default-logging
    networks:
      - real-estate-network

networks:
  real-estate-network:
    driver: bridge

volumes:
  real-estate-postgres-data:
  real-estate-redis-data:
  real-estate-frontend-node-modules:
  real-estate-flower-data:
  real-estate-flower-runtime-data:
